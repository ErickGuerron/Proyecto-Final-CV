services:
  php:
    build:
      context: .
      dockerfile: DockerFile
    container_name: proyecto-final-cv-php
    working_dir: /var/www/html
    environment:
      DB_HOST: ${DB_HOST}
      DB_PORT: ${DB_PORT}
      DB_USER: ${DB_USER}
      DB_PASSWORD: ${DB_PASSWORD}
      DB_NAME: ${DB_NAME}
    volumes:
      - .:/var/www/html
      - ./config/php-fpm/www.conf:/usr/local/etc/php-fpm.d/zz-docker.conf:ro
    restart: unless-stopped

  nginx:
    image: nginx:1.27-alpine
    container_name: proyecto-final-cv-nginx
    ports:
      - "80:80"
    volumes:
      - .:/var/www/html:ro
      - ./config/nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - php
    restart: unless-stopped
