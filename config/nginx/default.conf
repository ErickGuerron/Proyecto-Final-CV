server {
    listen 80;
    server_name _;

    # Carpeta raíz donde está index.php
    root /var/www/html;
    index index.php index.html index.htm;

    # Rutas generales (si no encuentra archivo, envía a index.php)
    location / {
        try_files $uri $uri/ /index.php?$query_string;
    }

    # Archivos PHP: se envían a PHP-FPM
    location ~ \.php$ {
        include fastcgi_params;
        fastcgi_pass php:9000;          # nombre del servicio PHP en docker-compose
        fastcgi_index index.php;
        fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
    }

    # Archivos estáticos (CSS, JS, imágenes, etc.)
    location ~* \.(css|js|png|jpg|jpeg|gif|ico|svg|webp)$ {
        try_files $uri $uri/ =404;
        expires 7d;
        add_header Cache-Control "public";
    }
}
